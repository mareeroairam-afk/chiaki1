name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Detect and install NDK
        run: |
          NDK_VER=$(grep -ohP 'ndkVersion\s*[="]+\s*"\K[0-9.]+' android/app/build.gradle android/build.gradle 2>/dev/null | head -1)
          if [ -z "$NDK_VER" ]; then NDK_VER="21.4.7075529"; fi
          echo "Usando NDK: $NDK_VER"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --verbose "ndk;$NDK_VER" "cmake;3.22.1"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libssl-dev nasm ninja-build
          pip3 install protobuf grpcio-tools

      - name: Patch deprecated repositories
        run: |
          find android -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} \;

      - name: Build APK
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          cd android
          chmod +x gradlew
          echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties
          ./gradlew assembleDebug --stacktrace -x lint -Pandroid.injected.cmake.args="-DProtobuf_PROTOC_EXECUTABLE=/usr/bin/protoc"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk

name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Detect and install correct NDK version
        run: |
          NDK_VER=$(grep -oP 'ndkVersion\s*[="]\s*"\K[0-9.]+' android/app/build.gradle 2>/dev/null || echo "")
          if [ -z "$NDK_VER" ]; then
            NDK_VER=$(grep -oP 'ndkVersion\s+"\K[0-9.]+' android/build.gradle 2>/dev/null || echo "21.4.7075529")
          fi
          echo "Using NDK version: $NDK_VER"
          echo "NDK_VERSION=$NDK_VER" >> $GITHUB_ENV
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --verbose "ndk;$NDK_VER" "cmake;3.22.1"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libssl-dev nasm ninja-build
          pip3 install protobuf grpcio-tools
          which protoc
          protoc --version

      - name: Patch deprecated JCenter repository
        run: |
          find android -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} \;

      - name: Build APK
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          cd android
          chmod +x gradlew
          echo "org.gradle.java.home=${JAVA_HOME}" >> gradle.properties
          ./gradlew assembleDebug --stacktrace -Pandroid.injected.cmake.args="-DProtobuf_PROTOC_EXECUTABLE=/usr/bin/protoc"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
